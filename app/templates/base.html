<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Negocio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 flex h-screen font-sans text-slate-800 antialiased overflow-hidden">

    <aside class="w-64 bg-[#0f172a] text-white flex flex-col shadow-2xl z-10">
        <div class="p-6 flex items-center space-x-3 border-b border-slate-700/50">
            <div class="bg-gradient-to-tr from-blue-500 to-purple-500 text-transparent bg-clip-text">
                <i class="fas fa-rocket text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black tracking-tight">Negocio <span class="text-blue-500">Pro</span></h2>
        </div>
        
        <nav class="flex-1 p-4 space-y-2 mt-4 overflow-y-auto">
            <a href="{{ url_for('index') }}" class="flex items-center space-x-3 text-white bg-blue-600 hover:bg-blue-700 p-3 rounded-xl transition shadow-md shadow-blue-900/20">
                <i class="fas fa-home w-5"></i>
                <span class="font-medium">Dashboard</span>
            </a>
            <a href="{{ url_for('proveedores') }}" class="flex items-center space-x-3 text-slate-400 hover:text-white hover:bg-slate-800 p-3 rounded-xl transition">
                <i class="fas fa-truck w-5"></i>
                <span class="font-medium">Proveedores</span>
            </a>
            <a href="{{ url_for('quiniela') }}" class="flex items-center space-x-3 text-slate-400 hover:text-white hover:bg-slate-800 p-3 rounded-xl transition">
                <i class="fas fa-ticket-alt w-5"></i>
                <span class="font-medium">Quiniela</span>
            </a>
            <a href="{{ url_for('ingresos') }}" class="flex items-center space-x-3 text-slate-400 hover:text-white hover:bg-slate-800 p-3 rounded-xl transition">
                <i class="fas fa-store w-5"></i>
                <span class="font-medium">Ingresos Locales</span>
            </a>
            <a href="{{ url_for('gastos') }}" class="flex items-center space-x-3 text-slate-400 hover:text-white hover:bg-slate-800 p-3 rounded-xl transition">
                <i class="fas fa-receipt w-5"></i>
                <span class="font-medium">Gastos Locales</span>
            </a>
        </nav>

        {% if current_user.is_authenticated %}
        <div class="p-4">
            <a href="{{ url_for('logout') }}" class="flex items-center space-x-3 text-red-400 hover:text-white hover:bg-red-600 p-3 rounded-xl transition">
                <i class="fas fa-sign-out-alt w-5"></i>
                <span class="font-bold">Cerrar Sesión</span>
            </a>
        </div>
        {% endif %}

        <div class="p-4 border-t border-slate-700/50 text-xs text-slate-500 text-center">
            &copy; 2026 Negocio Pro
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="bg-white border-b border-slate-200 p-4 shadow-sm z-0">
            <div class="flex justify-between items-center">
                <h2 class="text-slate-600 font-medium italic">Gestión Integral de Negocios</h2>
            </div>
        </header>
        
        <div class="p-8 overflow-y-auto h-full">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
